services:
  - type: web
    name: resumeai
    env: python
    runtime: python3.11
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: BASE_URL
        value: https://resumeai.onrender.com
      # Secrets — set these in Render dashboard:
      # OPENROUTER_API_KEY
      # NOWPAYMENTS_API_KEY
      # NOWPAYMENTS_IPN_SECRET
      # GMAIL_USER, GMAIL_APP_PASSWORD (optional)