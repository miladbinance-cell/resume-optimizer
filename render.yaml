services:
  - type: web
    name: resumeai
    env: python3
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: openai/gpt-4o
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      - key: NOWPAYMENTS_CURRENCY
        value: usdttrc20
      - key: GMAIL_USER
        value: milad.binance@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: BASE_URL
        sync: false