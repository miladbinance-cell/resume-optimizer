<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ResumeAI — AI-Powered Resume Optimizer{% endblock %}</title>
    <meta name="description" content="{% block description %}Optimize your resume for ATS systems with AI. Get past the robots and land more interviews.{% endblock %}">
    <meta name="keywords" content="resume optimizer, ATS resume, AI resume, resume builder, cover letter generator, LinkedIn optimization">
    <meta name="author" content="ResumeAI">
    <meta property="og:title" content="ResumeAI — AI-Powered Resume Optimizer">
    <meta property="og:description" content="Optimize your resume for ATS systems with AI. Get past the robots and land more interviews.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://resumeai.com">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://resumeai.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.5s ease-out',
                        'pulse-slow': 'pulse 3s infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-text {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-gradient {
            background: linear-gradient(135deg, #eff6ff 0%, #faf5ff 50%, #f0fdf4 100%);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(37, 99, 235, 0.15);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-white text-gray-900 antialiased">
    {% include "includes/nav.html" %}
    
    <main>
        {% block content %}{% endblock %}
    </main>

    {% include "includes/footer.html" %}

    {% block extra_scripts %}{% endblock %}
</body>
</html>
